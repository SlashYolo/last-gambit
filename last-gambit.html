<script>
(() => {
'use strict';
if (!window.THREE) {
  document.getElementById('scr').innerHTML = '<h2>Не удалось загрузить Three.js</h2><p class="sub">Игре нужен интернет при первом запуске: проверьте подключение и обновите страницу.</p>';
  return;
}
/* ============================== utils ============================== */
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ============================== chess core ============================== */
const BASE = { P: ['P'], N: ['N'], B: ['B'], R: ['R'], Q: ['R', 'B'], K: ['K'] };
const TNAME = { P: 'Пешка', N: 'Конь', B: 'Слон', R: 'Ладья', Q: 'Ферзь', K: 'Король' };
const GLY = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
const gl = (t, s, cls = '') => `<span class="g ${s} ${cls}">${GLY[t]}︎</span>`;
const CV = { R: 5, B: 3.2, N: 3, K: 2, W: 1, F: 1.2, C: 2.4, Z: 2.2, D: 1, A: 1, P: 1, Pb: .3, Ps: .3, Pd: .25, Pc: .35 };
const valOf = mv => mv.reduce((s, c) => s + (CV[c] || 0), 0);
const MVNAME = {
  R: 'По прямой на любое расстояние', B: 'По диагонали на любое расстояние', N: 'Буквой Г (конь)',
  K: 'На 1 клетку в любую сторону', W: 'Шаг: 1 клетка по прямой', F: 'Косой шаг: 1 по диагонали',
  C: 'Верблюд: прыжок 3×1', Z: 'Зебра: прыжок 3×2', D: 'Скачок: на 2 по прямой через фигуры', A: 'Слоновий скачок: на 2 по диагонали',
  P: 'Вперёд на 1 (с места на 2), бьёт по диагонали', Pb: 'Отступление: шаг назад', Ps: 'Боковой шаг влево и вправо',
  Pd: 'Рывок: всегда может пойти на 2', Pc: 'Таран: бьёт прямо вперёд'
};
function sym(a, b) {
  const seen = new Set(), out = [];
  for (const [x, y] of [[a, b], [b, a]]) for (const sx of [1, -1]) for (const sy of [1, -1]) {
    const k = (x * sx) + ',' + (y * sy);
    if (!seen.has(k)) { seen.add(k); out.push([x * sx, y * sy]); }
  }
  return out;
}
const LEAP = { N: sym(1, 2), C: sym(1, 3), Z: sym(2, 3), D: sym(2, 0), A: sym(2, 2), W: sym(1, 0), F: sym(1, 1) };
LEAP.K = [...LEAP.W, ...LEAP.F];
let PROMO_W = 7;

function pseudo(b, i, out) {
  const p = b[i]; if (!p || p.fz > 0) return;
  const x = i & 7, y = i >> 3, dir = p.s === 'w' ? 1 : -1;
  const add = (tx, ty, mode) => {
    if (tx < 0 || tx > 7 || ty < 0 || ty > 7) return false;
    const j = ty * 8 + tx, q = b[j];
    if (!q) { if (mode !== 2) out.push({ f: i, t: j, c: 0 }); return true; }
    if (q.s !== p.s && mode !== 1) out.push({ f: i, t: j, c: 1 });
    return false;
  };
  for (const m of p.mv) {
    if (m === 'R' || m === 'B') {
      for (const [dx, dy] of (m === 'R' ? LEAP.W : LEAP.F)) { let tx = x + dx, ty = y + dy; while (add(tx, ty, 0)) { tx += dx; ty += dy; } }
    } else if (LEAP[m]) {
      for (const [dx, dy] of LEAP[m]) add(x + dx, y + dy, 0);
    } else if (m === 'P') {

function genEnc(ante, kind) {

  const pieces = [], opts = [['N', 3], ['B', 3], ['R', 5]]; if (ante >= 3) opts.push(['Q', 9]);

  if (boss && boss.id === 'guard') pieces.push('R');
  const pawns = Math.min(6, 2 + ante + (kind > 0 ? 1 : 0));
  let limit = 11 + ante + pieces.length * 2 + (kind === 2 ? 2 : 0);
  if (boss && boss.id === 'haste') limit -= 3;
  if (boss && boss.id === 'iron') limit += 2;
  return {
    ante, kind, boss, pieces, pawns, limit, elite: ante >= 3 ? Math.min(.5, .12 * (ante - 2)) : 0,
    reward: [3, 4, 6][kind] + ante - 1,
    name: kind === 0 ? 'Малая ситуация' : kind === 1 ? 'Большая ситуация' : boss.name,

    await wait(900); toast('Перо феникса сгорает — попытка заново!', 2400); SFX.magic();
    flashFx(.6, 0xffa040); startLevel(); return;
  }
  G.mode = 'over';
  await wait(1000);
  BEST.ante = Math.max(BEST.ante, G.enc.ante); saveBest();
  showOverlay(`
    <h2 class="big red">ПОРАЖЕНИЕ</h2>
    <p class="sub">${esc(reason)}.</p>
    <div class="tally">
      <div style="animation-delay:.1s"><span>Дошли до анте</span><b>${G.enc.ante}</b></div>
      <div style="animation-delay:.3s"><span>Побед в забеге</span><b>${G.wins}</b></div>
      <div style="animation-delay:.5s"><span>Размер армии</span><b>${G.army.length}</b></div>
      <div class="tot" style="animation-delay:.7s"><span>Рекорд</span><b>анте ${BEST.ante} · ${BEST.wins}</b></div>
    </div>
    <div class="row-btns"><button class="btn red" data-act="start" type="button">Новый забег</button><button class="btn ghost" data-act="title" type="button">В меню</button></div>`);
}
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? b : c; };

/* ---------- consumables ---------- */
function targetSquares(id) {
  const t = CONS[id].target, out = [];
  G.board.forEach((p, i) => {
    if (!p) return;
    if (t === 'enemy' && p.s === 'b' && p.t !== 'K') out.push(i);
    if (t === 'enemyPawn' && p.s === 'b' && p.t === 'P') out.push(i);
    if (t === 'own' && p.s === 'w' && p.t !== 'K') out.push(i);
  });
  return out;
}
function useCons(ix) {
  if (G.mode !== 'play' || G.busy) { toast('Расходники применяются в свой ход'); return; }
  const id = G.cons[ix]; if (!id) return;
  if (G.targeting && G.targeting.ix === ix) { G.targeting = null; renderHUD(); refreshMarks(); setStatus('Ваш ход'); return; }
  const c = CONS[id];
  if (c.target) {
    if (!targetSquares(id).length) { toast('Нет подходящей цели'); return; }
    G.targeting = { ix, id }; G.sel = -1; renderHUD(); refreshMarks();
    setStatus(`${c.name}: выберите цель (Esc — отмена)`, 'target'); SFX.select(); return;
  }
  if (id === 'sand') { G.limit += 3; toast('+3 хода'); }
  if (id === 'rewind') {
    const h = G.history.pop(); if (!h) { toast('Пока нечего отменять'); return; }
    Object.assign(G, { board: h.board, used: h.used, limit: h.limit, lastMove: h.lastMove, gold: h.gold, checksBonus: h.checks, coffeeUsed: h.coffee });
    syncMeshes(G.board); G.moves = legal(G.board, 'w'); toast('Время повернулось вспять');
  }
  G.cons.splice(ix, 1); SFX.magic(); flashFx(.25, 0xb48cff); renderHUD(); refreshMarks(); afterConsumable();
}
function applyTarget(i) {
  const { ix, id } = G.targeting;
  if (!targetSquares(id).includes(i)) { toast('Сюда нельзя'); return; }
  const p = G.board[i]; const b = G.board.slice();
  if (id === 'ice') { b[i] = { ...p, fz: 3 }; floatText(i, 'Заморожен', '#9fdcff'); burst(sqPos(i).setY(.6), [0x9fdcff, 0xffffff], 20, 1.8, 3); }
  if (id === 'hammer') { b[i] = null; shake(.014, .3); burst(sqPos(i).setY(.4), [0xa3283c, 0x2a1424, 0xb9c6cf], 34); SFX.capture(); }
  if (id === 'bless') { b[i] = { ...p, hp: p.hp + 1, mhp: p.mhp + 1 }; floatText(i, '+1 ♥', '#ff8a9a'); burst(sqPos(i).setY(.8), [0xfff3c0, 0xff8a9a], 18, 1.4, 3); }
  G.board = b; G.cons.splice(ix, 1); G.targeting = null; SFX.magic();
  syncMeshes(G.board); G.moves = legal(G.board, 'w'); renderHUD(); refreshMarks(); afterConsumable();
}
function afterConsumable() {
  if (!hasLegal(G.board, 'b')) { winLevel(inCheck(G.board, 'b') ? 'mate' : 'stalemate'); return; }
  setStatus(`Ваш ход · осталось ${G.limit - G.used}`);
}

/* ============================== shop ============================== */
function offerUpgrade() {
  const c = []; for (const a of G.army) for (const u of (UPS[a.t] || [])) if (!a.ups.includes(u[0])) c.push([a, u]);
  if (!c.length) return null; const [a, u] = pick(c);
  return { kind: 'up', band: 'Новый ход', aid: a.id, code: u[0], title: u[1], desc: u[2], cost: rint(4, 6), t: a.t, key: 'up' + a.id + u[0] };
}
function offerLife() {
  const c = G.army.filter(a => a.t !== 'K' && a.mhp < 3); if (!c.length) return null; const a = pick(c);
  return { kind: 'life', band: 'Жизнь', aid: a.id, title: '+1 жизнь', desc: 'Взятие сначала снимает жизнь, а фигура остаётся на месте', cost: 3 + a.mhp * 2, t: a.t, key: 'life' + a.id };
}
function offerPerk() {
  const c = []; for (const a of G.army) { if (!a.th) c.push([a, 'th']); if (!a.gr) c.push([a, 'gr']); }
  if (!c.length) return null; const [a, k] = pick(c);
  return k === 'th' ? { kind: 'perk', band: 'Свойство', aid: a.id, perk: 'th', title: 'Жажда', desc: 'Каждое взятие этой фигурой даёт +1 ход к лимиту', cost: 5, t: a.t, key: 'th' + a.id }
    : { kind: 'perk', band: 'Свойство', aid: a.id, perk: 'gr', title: 'Алчность', desc: 'Каждое взятие этой фигурой приносит $1', cost: 4, t: a.t, key: 'gr' + a.id };
}
function offerPromo() {
  const c = []; for (const a of G.army) {
    if (a.t === 'P') { c.push([a, 'N', 5]); c.push([a, 'B', 5]); }
    if (a.t === 'N' || a.t === 'B') c.push([a, 'R', 7]);
    if (a.t === 'R') c.push([a, 'Q', 10]);
  }
  if (!c.length) return null; const [a, to, cost] = pick(c);
  return { kind: 'promo', band: 'Повышение', aid: a.id, to, title: `${TNAME[a.t]} → ${TNAME[to].toLowerCase()}`, desc: `Фигура меняет тип навсегда. Подходящие улучшения сохраняются`, cost, t: to, key: 'pr' + a.id };
}
function offerRecruit() {
  if (G.army.length >= 14) return null; const [t, cost] = pick([['P', 3], ['P', 3], ['N', 6], ['B', 6], ['R', 9]]);
  return { kind: 'recruit', band: 'Новобранец', t, title: TNAME[t], desc: 'Новая фигура в вашей армии', cost, key: 'rc' + t + Math.random() };
}
function rollMain() {
  const out = [], keys = new Set(); let guard = 0;
  while (out.length < 3 && guard++ < 60) {
    const r = Math.random();
    const o = r < .4 ? offerUpgrade() : r < .54 ? offerLife() : r < .66 ? offerPerk() : r < .82 ? offerPromo() : offerRecruit();
    if (o && !keys.has(o.key) && !out.some(x => x.aid && x.aid === o.aid && x.kind === 'promo')) { keys.add(o.key); out.push(o); }
  }
  return out;
}
function showShop() {
  G.mode = 'shop'; setStatus('');
  const relPool = shuffle(Object.keys(RELICS).filter(id => !has(id))).slice(0, 2).map(id => ({ kind: 'relic', id, cost: RELICS[id].cost }));
  const consPool = shuffle(Object.keys(CONS)).slice(0, 2).map(id => ({ kind: 'cons', id, cost: CONS[id].cost }));
  G.shop = { main: rollMain(), relics: relPool, cons: consPool, reroll: 2 };
  renderShop();
}
function offerCard(o, row, ix) {
  let art, title, sub = '', desc, band, kcls = 'k-' + o.kind;
  if (o.kind === 'relic') { art = img(o.id, ''); title = RELICS[o.id].name; desc = RELICS[o.id].desc; band = 'Реликвия'; }
  else if (o.kind === 'cons') { art = img(o.id, ''); title = CONS[o.id].name; desc = CONS[o.id].desc; band = 'Расходник'; }
  else {
    art = gl(o.t, 'w'); title = o.title; desc = o.desc; band = o.band;
    if (o.aid) { const a = armyById(o.aid); sub = `<div class="for">для: ${esc(a ? a.name : '—')} (${TNAME[a ? a.t : o.t].toLowerCase()})</div>`; }
  }
  let blocked = '';
  if (o.kind === 'relic' && G.relics.length >= 5) blocked = 'Нет места';
  if (o.kind === 'cons' && G.cons.length >= consSlots()) blocked = 'Слоты заняты';
  const dis = o.sold || G.gold < o.cost || blocked;
  return `<div class="card ${kcls}${o.sold ? ' sold' : ''}"><div class="band">${band}</div><div class="art">${art}</div><h3>${esc(title)}</h3>${sub}<p>${esc(desc)}</p>
    <button class="btn gold small buy" type="button" data-buy="${row}:${ix}" ${dis ? 'disabled' : ''}>${o.sold ? 'Куплено' : blocked || `Купить $${o.cost}`}</button></div>`;
}
function renderShop() {
  const s = G.shop; renderHUD();
  const chips = G.army.map(a => `<span class="chip" data-arm="${a.id}">${gl(a.t, 'w')}${esc(a.name)}${a.ups.length ? ` <span class="tag">+${a.ups.length}</span>` : ''}${a.mhp > 1 ? ` <span class="tag hp">♥${a.mhp}</span>` : ''}</span>`).join('');
  showOverlay(`
    <div class="scr-head"><div class="eyebrow">Анте ${G.enc.ante} · побед ${G.wins}</div><h2>Лавка</h2><div class="goldbig">$${G.gold}</div></div>
    <div class="shop-col"><div class="lbl">Прокачка армии</div><div class="cards">${s.main.map((o, i) => offerCard(o, 'main', i)).join('') || '<p class="sub">Пусто — обновите витрину</p>'}</div></div>
    <div class="shop-cols">
      <div class="shop-col"><div class="lbl">Реликвии</div><div class="cards">${s.relics.map((o, i) => offerCard(o, 'relics', i)).join('') || '<p class="sub">Всё раскуплено</p>'}</div></div>
      <div class="shop-col"><div class="lbl">Расходники</div><div class="cards">${s.cons.map((o, i) => offerCard(o, 'cons', i)).join('')}</div></div>
    </div>
    <div class="shop-col"><div class="lbl">Ваша армия · наведите, чтобы увидеть ходы</div><div class="chips">${chips}</div></div>
    <div class="row-btns"><button class="btn green" type="button" data-act="reroll" ${G.gold < s.reroll ? 'disabled' : ''}>Обновить $${s.reroll}</button><button class="btn red" type="button" data-act="leaveShop">Дальше</button></div>`);
}
function buy(row, ix) {
  const o = G.shop[row][ix]; if (!o || o.sold || G.gold < o.cost) return;
  if (o.kind === 'relic' && G.relics.length >= 5) return;
  if (o.kind === 'cons' && G.cons.length >= consSlots()) return;
  G.gold -= o.cost; o.sold = true;
  const a = o.aid ? armyById(o.aid) : null;
  switch (o.kind) {
    case 'up': a.ups.push(o.code); toast(`${a.name}: ${o.title}`); break;
    case 'life': a.mhp++; toast(`${a.name}: теперь ${a.mhp} жизни`); break;
    case 'perk': a[o.perk] = true; toast(`${a.name}: ${o.title}`); break;
    case 'promo': a.t = o.to; a.ups = a.ups.filter(c => c[0] !== 'P' && !BASE[o.to].includes(c)); toast(`${a.name} — теперь ${TNAME[o.to].toLowerCase()}`); break;
    case 'recruit': { const n = mkArmy(o.t); G.army.push(n); toast(`В армию вступает ${n.name}`); break; }
    case 'relic': G.relics.push(o.id); toast(`Реликвия: ${RELICS[o.id].name}`); break;
    case 'cons': G.cons.push(o.id); break;
  }
  SFX.buy(); flashFx(.15, 0xf3b53c); renderShop();
}

/* ============================== input ============================== */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let mouseNX = 0, mouseNY = 0;
function pickSq(cx, cy) {
  const c = curveJS(cx / W, 1 - cy / H); ndc.set(c[0] * 2 - 1, c[1] * 2 - 1);
  ray.setFromCamera(ndc, camera);
  const hitsArr = ray.intersectObjects([...tileMeshes, ...meshes.values()], true);
  for (const h of hitsArr) {
    let o = h.object;
    while (o && o.userData.sq === undefined && o.userData.k === undefined) o = o.parent;
    if (!o) continue;
    if (o.userData.sq !== undefined) return o.userData.sq;
    const i = G.board ? G.board.findIndex(p => p && p.k === o.userData.k) : -1;
    if (i >= 0) return i;
  }
  return -1;
}
canvas.addEventListener('pointermove', e => {
  mouseNX = e.clientX / W * 2 - 1; mouseNY = e.clientY / H * 2 - 1;
  if (G.mode !== 'play') { canvas.style.cursor = 'default'; return; }
  const sq = pickSq(e.clientX, e.clientY);
  if (sq !== G.hover) { G.hover = sq; refreshMarks(); renderPieceCard(); }
  const p = sq >= 0 ? G.board[sq] : null;
  const actionable = G.targeting ? targetSquares(G.targeting.id).includes(sq) : (p && p.s === 'w') || (G.sel >= 0 && G.moves.some(m => m.f === G.sel && m.t === sq));
  canvas.style.cursor = actionable ? 'pointer' : 'default';
});
canvas.addEventListener('pointerleave', () => { if (G.hover !== -1) { G.hover = -1; refreshMarks(); renderPieceCard(); } });
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (G.mode !== 'play' || G.busy) return;
  const sq = pickSq(e.clientX, e.clientY); if (sq < 0) { deselect(); return; }
  if (G.targeting) { applyTarget(sq); return; }
  if (G.sel >= 0) { const m = G.moves.find(mm => mm.f === G.sel && mm.t === sq); if (m) { playerMove(m); return; } }
  const p = G.board[sq];
  if (p && p.s === 'w') selectSq(sq); else deselect();
});
canvas.addEventListener('contextmenu', e => { e.preventDefault(); deselect(); });
function selectSq(sq) {
  const p = G.board[sq]; if (G.sel === sq) { deselect(); return; }
  G.sel = sq; SFX.select();
  if (p.fz > 0) toast(`${armyById(p.id)?.name || 'Фигура'} скована ещё ${p.fz} ход.`);
  else if (!G.moves.some(m => m.f === sq)) toast('У этой фигуры нет допустимых ходов');
  refreshMarks(); renderPieceCard();
}
function deselect() { if (G.targeting) { G.targeting = null; renderHUD(); setStatus('Ваш ход'); } G.sel = -1; refreshMarks(); renderPieceCard(); }
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#peekBack').hidden) $('#peekBack').click(); else deselect(); } });

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'start') newRun();
    else if (act === 'title') showTitle();
    else if (act === 'play') startLevel();
    else if (act === 'skip') skipEnc();
    else if (act === 'peek') { hideOverlay(); $('#peekBack').hidden = false; setStatus('Осмотр расстановки'); }
    else if (act === 'toShop') { advanceEnc(); showShop(); }
    else if (act === 'reroll') { if (G.gold >= G.shop.reroll) { G.gold -= G.shop.reroll; G.shop.reroll++; G.shop.main = rollMain(); SFX.coin(); renderShop(); } }
    else if (act === 'leaveShop') showSelect();
    return;
  }
  const b = e.target.closest('[data-buy]'); if (b) { const [row, ix] = b.dataset.buy.split(':'); buy(row, +ix); return; }
  const c = e.target.closest('[data-cons]'); if (c) { useCons(+c.dataset.cons); return; }
  const arm = e.target.closest('[data-arm]');
  if (arm && G.mode === 'play' && !G.busy) { const i = G.board.findIndex(p => p && p.id === +arm.dataset.arm); if (i >= 0) selectSq(i); }
});
$('#peekBack').addEventListener('click', () => { $('#peekBack').hidden = true; ov.hidden = false; setStatus(''); });
let giveUpArmed = 0;
$('#bGiveUp').addEventListener('click', () => {
  if (G.mode !== 'play' || G.busy) return;
  const btn = $('#bGiveUp');
  if (Date.now() - giveUpArmed < 2500) { if (has('phoenix')) G.relics.splice(G.relics.indexOf('phoenix'), 1); loseLevel('Вы сдались'); btn.textContent = 'Сдаться'; giveUpArmed = 0; return; }
  giveUpArmed = Date.now(); btn.textContent = 'Точно?'; setTimeout(() => { btn.textContent = 'Сдаться'; }, 2500);
});
$('#bMute').addEventListener('click', () => { muted = !muted; $('#bMute').textContent = muted ? 'Звук: выкл' : 'Звук: вкл'; });

/* ============================== loop ============================== */
let last = performance.now(), time = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; if (tw.t < 0) continue;
    const k = Math.min(1, tw.t / tw.dur); tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const m = particles[i], u = m.userData; u.life -= dt;
    u.v.y -= 11 * dt; m.position.addScaledVector(u.v, dt);
    if (m.position.y < 0.05) { m.position.y = 0.05; u.v.y *= -0.35; u.v.x *= .7; u.v.z *= .7; }
    m.rotation.x += dt * 6; m.rotation.y += dt * 5;
    if (u.life <= 0) { scene.remove(m); particles.splice(i, 1); } else if (u.life < .3) m.scale.multiplyScalar(.9);
  }
  for (const r of auras) { r.rotation.y += dt * .8; }
  for (const m of pulseMats) m.opacity = m.userData.base * (.6 + .4 * Math.sin(time * 6));
  // selected piece bob + light
  if (G.mode === 'play' && G.sel >= 0 && G.board && G.board[G.sel]) {
    const m = meshes.get(G.board[G.sel].k);
    if (m && !m.userData.anim) { m.position.y = .08 + Math.sin(time * 5) * .05; const v = sqPos(G.sel); selLight.position.set(v.x, 1.2, v.z); selLight.intensity = 1.4; }
  } else selLight.intensity = 0;
  for (const m of meshes.values()) if (!m.userData.anim && !(G.sel >= 0 && G.board && G.board[G.sel] && G.board[G.sel].k === m.userData.k) && m.position.y > 0 && m.position.y < .2) m.position.y = Math.max(0, m.position.y - dt);
  // camera
  camera.position.copy(camBase);
  camera.position.x += Math.sin(time * .3) * .12 + mouseNX * .35;
  camera.position.y += Math.sin(time * .23) * .06 - mouseNY * .2;
  camera.lookAt(camTarget);
  // post
  let sx = 0, sy = 0;
  if (shakeT > 0) { shakeT -= dt; sx = (Math.random() - .5) * shakeAmp; sy = (Math.random() - .5) * shakeAmp; } else shakeAmp = 0;
  const u = postMat.uniforms; u.time.value = time; u.shake.value.set(sx, sy); u.flash.value *= Math.pow(0.02, dt);
  const danger = G.mode === 'play' && G.board && inCheckCached() ? .55 + .45 * Math.sin(time * 5) : 0;
  u.danger.value += (danger - u.danger.value) * Math.min(1, dt * 8);
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
let ccBoard = null, ccVal = false;
function inCheckCached() { if (ccBoard !== G.board) { ccBoard = G.board; ccVal = inCheck(G.board, 'w'); } return ccVal; }

/* ============================== boot ============================== */
resize();
showTitle();
requestAnimationFrame(loop);
window.__LG = { G, play: m => playerMove(m), legal, applyMove, aiChoose, genEnc, genPosition, inCheck };
})();
</script>
