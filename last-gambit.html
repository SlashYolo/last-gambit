<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Последний гамбит</title>
<meta name="description" content="Шахматный рогалик на задачах Lichess: мат за лимит ходов, прокачка фигур, реликвии и лавка.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Press+Start+2P&display=swap">
<style>/* tiny5-sized */
/* Layout: full-screen pixel-3D board in the middle, chunky card-table HUD columns left/right, overlay screens for select / shop / results */
:root{
  color-scheme: dark;
  --ink:#0b0e13; --panel:#1a2430; --panel2:#243344; --line:#06080b;
  --text:#f2ead6; --muted:#93a6b4;
  --red:#e8483b; --red-d:#9b2230; --blue:#2f8fe0; --gold:#f3b53c; --gold-d:#3a2c10; --green:#3fae6a; --violet:#8a5cd6;
  --f-ui:'Tiny5', ui-monospace, Menlo, monospace;
  --f-head:'Press Start 2P', ui-monospace, Menlo, monospace;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;font-family:var(--f-ui);font-size:16px;-webkit-font-smoothing:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.hud{position:fixed;z-index:5;display:flex;flex-direction:column;gap:10px}
#hudL{left:16px;top:16px;bottom:16px;width:252px;overflow-y:auto;scrollbar-width:none}
#hudR{right:16px;top:16px;width:236px;max-height:calc(100% - 32px);overflow-y:auto;scrollbar-width:none}
.blk{background:var(--panel);border:3px solid var(--line);border-radius:10px;box-shadow:0 4px 0 var(--line);padding:10px 12px}
.eyebrow,.lbl{font-family:var(--f-head);font-size:8px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;line-height:1.6}
.hname{font-family:var(--f-head);font-size:12px;line-height:1.5;margin-top:6px;text-wrap:balance}
.hmod{margin-top:6px;font-size:16px;color:#ffb0a6;line-height:1.25}
.hmate{margin-top:6px;font-family:var(--f-head);font-size:9px;line-height:1.6;color:var(--gold)}
.goal{font-size:16px;line-height:1.3;color:var(--muted)}
.goal b{color:var(--text);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:3px solid var(--line);border-radius:10px;box-shadow:0 4px 0 var(--line);padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.stat span{font-family:var(--f-head);font-size:7px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.stat b{font-family:var(--f-head);font-size:22px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat small{font-size:14px;opacity:.85}
.stat.moves{background:var(--red)}
.stat.moves.low{animation:throb .6s ease-in-out infinite}
@keyframes throb{50%{filter:brightness(1.3)}}
.stat.rew{background:var(--gold-d);color:var(--gold)}
.money{background:var(--panel2);border:3px solid var(--line);border-radius:10px;box-shadow:0 4px 0 var(--line);padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.money span{font-family:var(--f-head);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.money b{font-family:var(--f-head);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.slot{width:44px;height:44px;border-radius:8px;border:3px solid var(--line);background:var(--panel2);display:grid;place-items:center;box-shadow:0 3px 0 var(--line);padding:0;color:inherit;font:inherit}
button.slot{cursor:pointer}
button.slot:hover{transform:translateY(-2px) rotate(-3deg)}
.slot.empty{background:transparent;border:2px dashed #33465a;box-shadow:none}
.slot.armed{outline:3px solid var(--violet);outline-offset:2px}
.slot img,.ico{width:30px;height:30px;image-rendering:pixelated;display:block}
.btns{display:flex;gap:8px}
.btn{font-family:var(--f-head);font-size:10px;line-height:1.4;padding:11px 14px;border:3px solid var(--line);border-radius:10px;box-shadow:0 4px 0 var(--line);color:var(--text);background:var(--blue);cursor:pointer;transition:transform .08s,filter .1s;text-transform:uppercase;letter-spacing:.05em}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.red{background:var(--red)} .btn.gold{background:var(--gold);color:#2a1c05} .btn.green{background:var(--green)} .btn.ghost{background:var(--panel2)} .btn.violet{background:var(--violet)}
.btn.small{font-size:8px;padding:8px 10px}
.btn:disabled{filter:grayscale(.85) brightness(.65);cursor:not-allowed;transform:none}
.btn:focus-visible,.slot:focus-visible,.arm:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.g{font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans",serif;font-style:normal;line-height:1}
.g.w{color:#fff3d6;text-shadow:0 0 1px #000,1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
.g.b{color:#e8483b;text-shadow:0 0 1px #000,1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
/* piece card */
.pc-head{display:flex;gap:10px;align-items:center}
.pc-head .g{font-size:40px}
.pc-name{font-family:var(--f-head);font-size:11px;line-height:1.5}
.pc-type{font-size:15px;color:var(--muted)}
.hearts{display:flex;gap:2px;margin-top:4px}
.hearts img{width:16px;height:16px;image-rendering:pixelated}
.mvlist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.25}
.mvlist li{display:flex;gap:6px}
.mvlist li::before{content:"";flex:0 0 8px;height:8px;margin-top:5px;background:var(--blue);border:2px solid var(--line)}
.mvlist li.up::before{background:var(--gold)}
.mvlist li.perk::before{background:var(--violet)}
.mvlist li.bad::before{background:#9fdcff}
.coach-text{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;font-size:15px;line-height:1.35}
.coach-text p{margin:0}
.coach-text p.hint{color:#bfefff;background:#173040;border:2px solid var(--line);border-radius:6px;padding:6px}
.coach-text p.warn{color:#ffb0a6}
.coach-text p.good{color:#9be8b4}
.coach-text b{color:var(--gold)}
.coach .btns{flex-wrap:wrap}
#hudR{width:268px}
.muted{color:var(--muted);font-size:15px;line-height:1.35;margin:6px 0 0}
.army{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.arm{display:flex;align-items:center;gap:8px;padding:2px 6px;border-radius:6px;background:var(--panel2);border:2px solid var(--line);cursor:pointer;color:inherit;font:inherit;text-align:left;width:100%}
.arm:hover{filter:brightness(1.15)}
.arm.dead{opacity:.4}
.arm .g{font-size:20px;width:22px;text-align:center}
.arm .an{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arm .tags{display:flex;gap:3px}
.tag{font-family:var(--f-head);font-size:7px;padding:3px 4px;border-radius:4px;border:2px solid var(--line);background:var(--gold);color:#2a1c05}
.tag.hp{background:var(--red);color:#fff}
.tag.pk{background:var(--violet);color:#fff}
#status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;font-family:var(--f-head);font-size:10px;line-height:1.5;padding:10px 16px;background:var(--panel);border:3px solid var(--line);border-radius:10px;box-shadow:0 4px 0 var(--line);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#status.check{background:var(--red)}
#status.think{background:var(--panel2);color:var(--muted)}
#status.target{background:var(--violet)}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:30;font-family:var(--f-head);font-size:10px;line-height:1.5;padding:10px 14px;background:var(--gold);color:#2a1c05;border:3px solid var(--line);border-radius:10px;box-shadow:0 4px 0 var(--line);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#peekBack{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:25}
#tip{position:fixed;z-index:40;max-width:240px;background:var(--panel);border:3px solid var(--line);border-radius:8px;box-shadow:0 4px 0 var(--line);padding:8px 10px;font-size:15px;line-height:1.3;pointer-events:none}
#tip b{display:block;font-family:var(--f-head);font-size:9px;line-height:1.5;margin-bottom:4px;color:var(--gold)}
.float{position:fixed;z-index:15;font-family:var(--f-head);font-size:12px;pointer-events:none;text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000;animation:rise 1.2s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes rise{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-56px}}
/* overlays */
#ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,11,.62);padding:16px;overflow:auto}
.screen{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:18px;align-items:center;margin:auto}
.screen h2{font-family:var(--f-head);font-size:20px;line-height:1.4;margin:0;text-align:center;text-wrap:balance;text-shadow:0 4px 0 var(--line)}
.scr-head{display:flex;flex-direction:column;align-items:center;gap:8px}
.cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start}
.card{width:196px;background:var(--panel);border:3px solid var(--line);border-radius:12px;box-shadow:0 6px 0 var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;animation:bob 3.4s ease-in-out infinite;transition:transform .15s}
.card:nth-child(2){animation-delay:-1.1s}.card:nth-child(3){animation-delay:-2.2s}.card:nth-child(4){animation-delay:-.6s}
.card:hover{transform:translateY(-6px) rotate(-1.2deg)}
@keyframes bob{50%{translate:0 -4px}}
@media (prefers-reduced-motion:reduce){.card,.stat.moves.low,.title-word{animation:none!important}}
.band{font-family:var(--f-head);font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:6px;border:2px solid var(--line);text-align:center}
.k-up .band{background:var(--blue)} .k-life .band{background:var(--red)} .k-perk .band{background:var(--violet)} .k-promo .band{background:var(--gold);color:#2a1c05} .k-recruit .band{background:var(--green)} .k-relic .band{background:#c9762a} .k-cons .band{background:#5b3fa8}
.card .art{height:72px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:8px}
.card .art .g{font-size:52px}
.card .art img{width:48px;height:48px;image-rendering:pixelated}
.card h3{font-family:var(--f-head);font-size:10px;line-height:1.5;margin:0;text-wrap:balance}
.card .for{font-size:15px;color:var(--gold)}
.card p{margin:0;font-size:15px;line-height:1.3;color:var(--muted);flex:1}
.card .buy{margin-top:auto}
.card.sold{opacity:.45;animation:none}
.blind{width:206px}
.blind.cur{width:252px;border-color:var(--gold);box-shadow:0 6px 0 var(--line),0 0 0 3px var(--line)}
.blind.done{opacity:.5;animation:none}
.blind.k0 .band{background:var(--blue)} .blind.k1 .band{background:#d6802a} .blind.k2 .band{background:var(--red)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--f-head);font-size:11px;font-variant-numeric:tabular-nums}
.kv b.gold{color:var(--gold)}
.foes{display:flex;flex-wrap:wrap;gap:2px;font-size:20px}
.mini{display:grid;grid-template-columns:repeat(8,1fr);width:100%;border:3px solid var(--line);border-radius:6px;overflow:hidden}
.mini i{aspect-ratio:1;display:grid;place-items:center;font-style:normal;font-size:18px;line-height:1}
.mini i.d{background:#2f5a54}.mini i.l{background:#b9a27c}
.mini i.fz{box-shadow:inset 0 0 0 2px #9fdcff}
.mini i.lm{background-image:linear-gradient(rgba(243,211,92,.55),rgba(243,211,92,.55))}
.mini i.hp2{box-shadow:inset 0 0 0 2px var(--red)}
.boss-mod{font-size:15px;line-height:1.3;color:#ffb0a6;background:#2a1418;border:2px solid var(--line);border-radius:6px;padding:6px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.shop-cols{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.shop-col{display:flex;flex-direction:column;gap:10px;align-items:center}
.goldbig{font-family:var(--f-head);font-size:16px;color:var(--gold);background:var(--gold-d);border:3px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:0 4px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:760px}
.chip{display:flex;align-items:center;gap:5px;padding:4px 8px;background:var(--panel);border:2px solid var(--line);border-radius:6px;font-size:15px}
.chip .g{font-size:18px}
.tally{width:min(420px,100%);background:var(--panel);border:3px solid var(--line);border-radius:12px;box-shadow:0 6px 0 var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tally div{display:flex;justify-content:space-between;gap:10px;font-size:16px;opacity:0;animation:pop .35s ease-out forwards}
.tally b{font-family:var(--f-head);font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.tally .tot{border-top:3px dashed #33465a;padding-top:8px}
.tally .tot b{font-size:16px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.screen h2.big,.big{font-family:var(--f-head);font-size:44px;line-height:1.2;margin:0;text-shadow:0 5px 0 var(--line),4px 0 0 var(--line),-4px 0 0 var(--line)}
.big.gold{color:var(--gold)} .big.red{color:var(--red)}
.sub{font-size:18px;color:var(--muted);text-align:center;margin:0;max-width:56ch;line-height:1.35}
.title{display:flex;flex-direction:column;align-items:center;gap:8px}
.title-word{font-family:var(--f-head);font-size:clamp(26px,6vw,58px);line-height:1.15;text-align:center;color:var(--text);text-shadow:0 6px 0 var(--red-d),5px 0 0 var(--line),-5px 0 0 var(--line),0 -5px 0 var(--line),0 11px 0 var(--line);animation:wob 3s ease-in-out infinite}
.title-word.two{color:var(--gold);animation-delay:-1.5s}
@keyframes wob{50%{transform:rotate(-1.5deg) translateY(-3px)}}
.rules{width:min(620px,100%);background:var(--panel);border:3px solid var(--line);border-radius:12px;box-shadow:0 6px 0 var(--line);padding:14px 18px}
.rules ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.35}
.credit{font-size:14px;color:var(--muted);text-align:center;margin:0}
.best{font-family:var(--f-head);font-size:9px;color:var(--muted);line-height:1.6;text-align:center}
@media (max-width:820px){
  #hudL{top:8px;left:8px;right:8px;bottom:auto;width:auto;flex-direction:row;flex-wrap:wrap;gap:6px;max-height:36vh}
  #hudL>*{flex:1 1 140px}
  #hudL .goal,#hudL .btns{display:none}
  #hudL .btns:last-child{display:flex}
  .blk{padding:6px 8px}
  .stat b{font-size:16px}
  .hname{font-size:10px}
  #hudR{top:auto;bottom:58px;left:8px;right:8px;width:auto;max-height:32vh}
  #hudR .armyblk{display:none}
  #status{bottom:8px;font-size:8px}
  .big{font-size:30px}
  .card,.blind,.blind.cur{width:min(100%,300px)}
}
</style>
</head>
<body>
<canvas id="gl" aria-label="Chess board"></canvas>

<aside id="hudL" class="hud" hidden>
  <div class="blk" id="hTitle"></div>
  <div class="blk goal" id="hGoal"></div>
  <div class="row2">
    <div class="stat moves" id="hMovesBox"><span id="hMovesLbl"></span><b id="hMoves">0</b><small id="hMovesOf"></small></div>
    <div class="stat rew" id="hRewBox"><span id="hRewLbl"></span><b id="hRew">$0</b><small id="hRewSub"></small></div>
  </div>
  <div class="money"><span id="hGoldLbl"></span><b id="hGold">$0</b></div>
  <div class="blk"><div class="lbl" id="hRelLbl"></div><div class="slots" id="hRelics"></div></div>
  <div class="blk"><div class="lbl" id="hConsLbl"></div><div class="slots" id="hCons"></div></div>
  <div class="btns"><button class="btn ghost small" id="bGiveUp" type="button"></button><button class="btn ghost small" id="bMute" type="button"></button></div>
  <div class="btns"><button class="btn ghost small" id="bBadges" type="button"></button><button class="btn ghost small" id="bLang" type="button"></button></div>
</aside>

<aside id="hudR" class="hud" hidden>
  <div class="blk coach" id="coachBlk" hidden><div class="lbl" id="coachLbl"></div><div class="coach-text" id="coachText" aria-live="polite"></div><div class="btns"><button class="btn violet small" id="bHint" type="button"></button><button class="btn green small" id="bHintPlay" type="button" hidden></button><button class="btn ghost small" id="bUndo" type="button"></button></div></div>
  <div class="blk" id="pieceCard"></div>
  <div class="blk armyblk"><div class="lbl" id="armyLbl"></div><div class="army" id="armyList"></div></div>
</aside>

<div id="status" hidden></div>
<div id="toast" hidden></div>
<div id="tip" hidden></div>
<button class="btn gold" id="peekBack" type="button" hidden></button>
<div id="ov"><div class="screen" id="scr"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* ============================== i18n ============================== */
const STR = {

}

let AC = null, muted = false;
function tone(freq, dur, type = 'square', vol = 0.06, slide = 0, delay = 0) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const tt = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, tt);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), tt + dur);
    g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    o.connect(g); g.connect(AC.destination); o.start(tt); o.stop(tt + dur + 0.02);
  } catch (e) { /* audio unavailable */ }
}

const POST_FRAG = `
uniform sampler2D tScene; uniform vec2 lowRes; uniform float time; uniform vec2 shake; uniform float flash; uniform float danger; uniform vec3 flashCol;
varying vec2 vUv;
vec2 curve(vec2 uv){ uv = uv*2.0-1.0; vec2 off = abs(uv.yx)/vec2(7.0,5.5); uv = uv + uv*off*off; return uv*0.5+0.5; }
float A(vec2 u){ return texture2D(tScene,u).a; }
vec3 swirl(vec2 uv){
  vec2 px = floor(uv*lowRes*0.5)/(lowRes*0.5);
  vec2 p = (px-0.5)*vec2(lowRes.x/lowRes.y,1.0)*3.2;
  float t = time*0.16;
  float r = length(p); float a = atan(p.y,p.x) + t + 1.4/(r+0.7);
  vec2 q = vec2(cos(a),sin(a))*r;
  for(int i=0;i<4;i++){ q += 0.55*vec2(sin(q.y*1.6+t*2.1), cos(q.x*1.4-t*1.8)); }
  float f = 0.5+0.5*sin(q.x*1.15+q.y*0.95);
  float g = 0.5+0.5*sin(length(q)*1.7 - t*3.0);
  vec3 c1 = vec3(0.06,0.15,0.26), c2 = vec3(0.34,0.07,0.12), c3 = vec3(0.03,0.04,0.07);
  vec3 col = mix(c1,c2,smoothstep(0.32,0.68,f));
  col = mix(col,c3,smoothstep(0.5,0.95,g)*0.75);
  col += vec3(0.05,0.03,0.0)*smoothstep(0.92,1.0,f);
  return floor(col*14.0+0.5)/14.0;
}
void main(){
  vec2 uv = curve(vUv);
  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0){ gl_FragColor = vec4(0.0,0.0,0.0,1.0); return; }
  vec2 su = uv + shake;
  vec4 s = texture2D(tScene, su);
  vec2 px = 1.0/lowRes;
  float rr = texture2D(tScene, su + vec2(px.x*0.6,0.0)).r;
  float bb = texture2D(tScene, su - vec2(px.x*0.6,0.0)).b;
  vec3 sc = vec3(mix(s.r,rr,0.5), s.g, mix(s.b,bb,0.5));
  vec3 bg = swirl(uv);
  vec3 col = mix(bg, sc, step(0.5,s.a));
  if(s.a < 0.5){
    float n = max(max(A(su+vec2(px.x,0.0)),A(su-vec2(px.x,0.0))),max(A(su+vec2(0.0,px.y)),A(su-vec2(0.0,px.y))));
    if(n > 0.5) col = vec3(0.025,0.02,0.04);
    else { float sh = A(su+vec2(-3.0*px.x, 4.0*px.y)); col = mix(col, col*0.4, step(0.5,sh)); }
  }
  vec2 d = uv-0.5; float r2 = dot(d,d);
  col *= 1.0 - r2*0.9;
  col += vec3(0.85,0.08,0.08)*danger*r2*1.8;
  col *= 0.93 + 0.07*sin(gl_FragCoord.y*1.5708);

function curveJS(u, v) {
  let x = u * 2 - 1, y = v * 2 - 1; const ox = Math.abs(y) / 7, oy = Math.abs(x) / 5.5;
  x += x * ox * ox; y += y * oy * oy; return [x * .5 + .5, y * .5 + .5];
}
function invCurve(u, v) { let a = u, b = v; for (let i = 0; i < 4; i++) { const c = curveJS(a, b); a -= c[0] - u; b -= c[1] - v; } return [a, b]; }

async function executeMove(m, side) {
  const tok = G.token;
  const mover = G.board[m.f], ev = {};
  const nb = applyMove(G.board, m, ev);
  const mesh = meshes.get(mover.k);
  if (ev.bounce) {
    if (mesh) await bounceAnim(mesh, m.f, m.t);
    if (tok !== G.token) return null;
    SFX.bounce(); shake(.006, .18); flashFx(.18, 0xff8060);
    burst(sqPos(m.t).setY(.8), [0xe8483b, 0xffffff], 10, 1.6, 2);
    floatText(m.t, '−1 ♥', '#ff6a5c');
  } else {
    if (mesh) await hop(mesh, m.f, m.t, mover.t === 'N');
    if (tok !== G.token) return null;
    if (ev.cap) {
      SFX.capture(); shake(.011, .26); flashFx(.22);
      const cols = ev.cap.s === 'w' ? [0xefe2c4, 0xe0a83a, 0xffffff] : [0xa3283c, 0x2a1424, 0xff6a5c];
      burst(sqPos(m.t).setY(.5), cols, 30);

    if (ev.cap || ev.bounce) {
      if (p.gr) { G.gold += 1; floatText(actor, '+$1'); SFX.coin(); }
      if (p.th) { G.limit += 1; floatText(actor, t('fl_move'), '#7cf0a0'); }
      if (has('grail') && p.hp < p.mhp) { G.board[actor] = { ...p, hp: p.hp + 1 }; floatText(actor, '+1 ♥', '#ff8a9a'); }
      if (ev.cap && ev.cap.t !== 'P' && has('butcher')) { G.gold += 2; floatText(m.t, '+$2'); SFX.coin(); }
    }
    if (ev.promo && p.id) {
      const a = armyById(p.id); a.t = 'Q'; a.ups = a.ups.filter(c => c[0] !== 'P' && !BASE.Q.includes(c));
      toast(t('toast_promo_own', { name: nameOf(a) })); SFX.magic(); burst(sqPos(m.t).setY(.6), [0xf3b53c, 0xfff3c0], 36, 2.4, 5);
    }

}
async function playerMove(m) {

  const sl = G.lineIx >= 0 ? G.enc.P.sol[G.lineIx] : null, onLine = !!sl && sl.f === m.f && sl.t === m.t;
  G.lineIx = onLine ? G.lineIx + 1 : -1; G.hint = null;

/* Forced-mate search on this game's own rules (upgrades, lives, frozen pieces). Mate and stalemate both count as wins. */
let SDL = 0, SABORT = false;

  list.sort((x, y) => (y.chk - x.chk) || (y.m.c - x.m.c));
  for (const s of list) {
    if (k === 1 && !s.chk) continue;
    if (!hasLegal(s.nb, 'b')) return s.m;
    if (k > 1 && bLoses(s.nb, k - 1)) return s.m;

}
function bLoses(b, k) {

  return true;
}
function findHintMove() {

  let best = null, bs = -1e9;

    const nb = applyMove(G.board, m); const chk = inCheck(nb, 'b');
    const sc = (chk ? 50 - legal(nb, 'b').length * 3 : 0) + (m.c ? G.board[m.t].v * 4 : 0) - evalB(nb);

}
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);

function offerUpgrade() {

}
function offerLife() {
  const c = G.army.filter(a => a.t !== 'K' && a.mhp < 3); if (!c.length) return null; const a = pick(c);
  return { kind: 'life', aid: a.id, cost: 3 + a.mhp * 2, t: a.t, key: 'life' + a.id };

function offerPerk() {

  refreshMarks(); renderPieceCard();
}
function deselect() { if (G.targeting) { G.targeting = null; renderHUD(); setStatus('st_your', { n: G.limit - G.used }); } G.sel = -1; refreshMarks(); renderPieceCard(); }

function setLang(l) {
  LANG = l; document.documentElement.lang = l;
  try { localStorage.setItem('last-gambit-lang', l); } catch (e) { /* ignore */ }
  renderStatic(); if (!hudL.hidden) renderHUD(); paintStatus();
  if (G.rerender && !ov.hidden) G.rerender();
}
function setBadges(v) {
  SHOW_BADGES = v; for (const m of meshes.values()) if (m.userData.badge) m.userData.badge.visible = v;
  $('#bBadges').textContent = v ? t('badges_on') : t('badges_off');
  try { localStorage.setItem('last-gambit-badges', v ? '1' : '0'); } catch (e) { /* ignore */ }
}
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'KeyH') askHint();
  if (e.code === 'KeyZ') trainUndo();
  if (e.key === 'Escape') { if (!$('#peekBack').hidden) $('#peekBack').click(); else deselect(); }
  if (e.code === 'KeyB') setBadges(!SHOW_BADGES);
});

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'start') newRun(false);
    else if (act === 'train') newRun(true);
    else if (act === 'retry') startLevel();
    else if (act === 'nextPz') { advanceEnc(); showSelect(); }
    else if (act === 'title') showTitle();
    else if (act === 'lang') setLang(LANG === 'ru' ? 'en' : 'ru');
    else if (act === 'play') startLevel();
    else if (act === 'skip') skipEnc();
    else if (act === 'peek') { hideOverlay(); $('#peekBack').hidden = false; setStatus('st_peek'); }
    else if (act === 'toShop') { advanceEnc(); showShop(); }
    else if (act === 'reroll') { if (G.gold >= G.shop.reroll) { G.gold -= G.shop.reroll; G.shop.reroll++; G.shop.main = rollMain(); SFX.coin(); renderShop(); } }
    else if (act === 'leaveShop') showSelect();
    return;
  }
  const b = e.target.closest('[data-buy]'); if (b) { const [row, ix] = b.dataset.buy.split(':'); buy(row, +ix); return; }
  const c = e.target.closest('[data-cons]'); if (c) { useCons(+c.dataset.cons); return; }
  const arm = e.target.closest('[data-arm]');
  if (arm && G.mode === 'play' && !G.busy) { const i = G.board.findIndex(p => p && p.id === +arm.dataset.arm); if (i >= 0) selectSq(i); }
});
$('#peekBack').addEventListener('click', () => { $('#peekBack').hidden = true; ov.hidden = false; setStatus(null); });
let giveUpArmed = 0;
$('#bGiveUp').addEventListener('click', () => {
  if (G.mode !== 'play' || G.busy) return;
  const btn = $('#bGiveUp');
  if (Date.now() - giveUpArmed < 2500) { giveUpArmed = 0; btn.textContent = t('give_up'); loseLevel('lose_giveup'); return; }
  giveUpArmed = Date.now(); btn.textContent = t('sure');
  setTimeout(() => { if (Date.now() - giveUpArmed >= 2400) { giveUpArmed = 0; btn.textContent = t('give_up'); } }, 2500);
});
$('#bMute').addEventListener('click', () => { muted = !muted; $('#bMute').textContent = muted ? t('sound_off') : t('sound_on'); });
$('#bBadges').addEventListener('click', () => setBadges(!SHOW_BADGES));
$('#bLang').addEventListener('click', () => setLang(LANG === 'ru' ? 'en' : 'ru'));
$('#bHint').addEventListener('click', askHint);
$('#bHintPlay').addEventListener('click', playHint);
$('#bUndo').addEventListener('click', trainUndo);

/* ============================== loop ============================== */
let last = performance.now(), time = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; if (tw.t < 0) continue;
    const k = Math.min(1, tw.t / tw.dur); tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const m = particles[i], u = m.userData; u.life -= dt;
    u.v.y -= 11 * dt; m.position.addScaledVector(u.v, dt);
    if (m.position.y < 0.05) { m.position.y = 0.05; u.v.y *= -0.35; u.v.x *= .7; u.v.z *= .7; }
    m.rotation.x += dt * 6; m.rotation.y += dt * 5;
    if (u.life <= 0) { scene.remove(m); particles.splice(i, 1); } else if (u.life < .3) m.scale.multiplyScalar(.9);
  }
  for (const r of auras) { r.rotation.y += dt * .8; }
  for (const m of pulseMats) m.opacity = m.userData.base * (.6 + .4 * Math.sin(time * 6));
  const selK = G.mode === 'play' && G.sel >= 0 && G.board && G.board[G.sel] ? G.board[G.sel].k : null;
  if (selK !== null) {
    const m = meshes.get(selK);
    if (m && !m.userData.anim) { m.position.y = .08 + Math.sin(time * 5) * .05; const v = sqPos(G.sel); selLight.position.set(v.x, 1.2, v.z); selLight.intensity = 1.4; }
  } else selLight.intensity = 0;
  for (const m of meshes.values()) if (!m.userData.anim && m.userData.k !== selK && m.position.y > 0 && m.position.y < .2) m.position.y = Math.max(0, m.position.y - dt);
  camera.position.copy(camBase);
  camera.position.x += Math.sin(time * .3) * .12 + mouseNX * .35;
  camera.position.y += Math.sin(time * .23) * .06 - mouseNY * .2;
  camera.lookAt(camTarget);
  let sx = 0, sy = 0;
  if (shakeT > 0) { shakeT -= dt; sx = (Math.random() - .5) * shakeAmp; sy = (Math.random() - .5) * shakeAmp; } else shakeAmp = 0;
  const u = postMat.uniforms; u.time.value = time; u.shake.value.set(sx, sy); u.flash.value *= Math.pow(0.02, dt);
  const danger = G.mode === 'play' && G.board && inCheckCached() ? .55 + .45 * Math.sin(time * 5) : 0;
  u.danger.value += (danger - u.danger.value) * Math.min(1, dt * 8);
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
let ccBoard = null, ccVal = false;
function inCheckCached() { if (ccBoard !== G.board) { ccBoard = G.board; ccVal = inCheck(G.board, 'w'); } return ccVal; }

/* ============================== boot ============================== */
resize();
renderStatic();
showTitle();
requestAnimationFrame(loop);
window.__LG = { G, askHint, findHintMove, explainMove, play: m => playerMove(m), legal, applyMove, aiChoose, parsePuzzle, BANK, setLang, inCheck, hasLegal };
})();
</script>
